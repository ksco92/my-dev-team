name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CLAUDE_CODE_VERSION: 2.1.283

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Validate dev-team plugin
        run: claude plugin validate plugins/dev-team --strict

      - name: Shellcheck plugin scripts
        run: |
          shopt -s nullglob
          scripts=(plugins/dev-team/hooks/*.sh plugins/dev-team/bin/* plugins/dev-team/tests/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No hooks/bin scripts yet, skipping shellcheck"
          else
            shellcheck "${scripts[@]}"
          fi

      - name: Test dev-process resolver and session hook
        run: bash plugins/dev-team/tests/dev-process.test.sh

      - name: Check plugin version bump
        if: github.event_name == 'pull_request'
        run: |
          plugin_path=plugins/dev-team/.claude-plugin/plugin.json
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "cannot read origin/main"
            exit 1
          fi
          if git cat-file -e "origin/main:$plugin_path" 2>/dev/null; then
            base_version=$(git show "origin/main:$plugin_path" | jq -r '.version')
          else
            base_version=""
          fi
          head_version=$(jq -r '.version' "$plugin_path")
          echo "base=$base_version head=$head_version"
          if [ "$base_version" = "$head_version" ]; then
            echo "plugin.json version must be bumped from $base_version"
            exit 1
          fi
