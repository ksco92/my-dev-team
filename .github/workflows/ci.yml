name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

env:
  CLAUDE_CODE_VERSION: 2.1.283

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Validate dev-team plugin
        run: claude plugin validate plugins/dev-team --strict

      - name: Shellcheck plugin scripts
        run: |
          shopt -s nullglob
          scripts=(plugins/dev-team/hooks/*.sh plugins/dev-team/bin/* plugins/dev-team/tests/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No hooks/bin scripts yet, skipping shellcheck"
          else
            shellcheck "${scripts[@]}"
          fi

      - name: Test dev-process resolver and session hook
        run: bash plugins/dev-team/tests/dev-process.test.sh

      - name: Test lesson-lint
        run: bash plugins/dev-team/tests/lesson-lint.test.sh

      - name: Test merge-gate and attribution-guard hooks
        run: bash plugins/dev-team/tests/merge-gate.test.sh

      - name: Test eval suite (case.yaml parsing, scaffold scripts)
        run: bash plugins/dev-team/tests/evals.test.sh

      - name: Lint added learned patterns
        run: |
          git ls-files -z 'plugins/dev-team/*.md' | xargs -0 plugins/dev-team/bin/lesson-lint --added origin/main

      - name: Check plugin version bump
        if: github.event_name == 'pull_request'
        run: |
          plugin_path=plugins/dev-team/.claude-plugin/plugin.json
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "cannot read origin/main"
            exit 1
          fi
          if git cat-file -e "origin/main:$plugin_path" 2>/dev/null; then
            base_version=$(git show "origin/main:$plugin_path" | jq -r '.version')
          else
            base_version=""
          fi
          head_version=$(jq -r '.version' "$plugin_path")
          echo "base=$base_version head=$head_version"
          if [ "$base_version" = "$head_version" ]; then
            echo "plugin.json version must be bumped from $base_version"
            exit 1
          fi

  evals:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-evals')
    steps:
      - uses: actions/checkout@v4

      - name: Check for ANTHROPIC_API_KEY
        id: has_key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice (no API key configured)
        if: steps.has_key.outputs.present != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set; skipping the eval suite."

      - uses: actions/setup-node@v4
        if: steps.has_key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.has_key.outputs.present == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Install pytest for the implementer case's sandboxed Bash
        if: steps.has_key.outputs.present == 'true'
        run: python3 -m pip install --break-system-packages "pytest==9.1.1"

      - name: Run eval suite
        if: steps.has_key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval plugins/dev-team --threshold 1.0 --max-cost-usd 5 --trust-plugin \
            --scaffold --allow-tools Bash Write Edit --ablation none --runs 1 --json

      - name: Upload eval report
        if: steps.has_key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: plugins/dev-team/evals/results/
